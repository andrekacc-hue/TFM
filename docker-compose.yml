# =====================================================================
#  Soporte TI Produbanco — Orquestación completa
#
#  Fase 1: Supabase self-hosted + Redis + Ollama (+ Jaeger opcional).
#  Los microservicios, el frontend y el bot se añaden en sus fases.
#
#  Puertos expuestos al host:
#    54321  Supabase API (Kong)   — lo necesita el navegador (auth/realtime)
#    54323  Supabase Studio
#    (docker-compose.dev.yml expone además DB, Redis, Ollama y Jaeger)
# =====================================================================
name: soporte-bancario-rag

networks:
  soporte-net:
    name: soporte-net
    driver: bridge

volumes:
  supabase-db-data:
  supabase-storage-data:
  redis-data:
  ollama-data:

services:
  # ------------------------------------------------------------------
  # Supabase — PostgreSQL 15 + pgvector
  # ------------------------------------------------------------------
  supabase-db:
    image: supabase/postgres:15.8.1.060
    profiles: [supabase-local]
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # Scripts de inicialización (solo se ejecutan con el volumen vacío)
      - ./supabase/docker/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./supabase/docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/docker/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      # Migraciones, seed y tests (los aplica scripts/bootstrap vía psql)
      - ./supabase:/workspace/supabase:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # Supabase Auth (GoTrue) — email/password + Azure AD (Entra ID)
  # ------------------------------------------------------------------
  supabase-auth:
    image: supabase/gotrue:v2.177.0
    profiles: [supabase-local]
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:54321}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # Microsoft SSO (Azure AD / Entra ID)
      GOTRUE_EXTERNAL_AZURE_ENABLED: ${AZURE_ENABLED:-false}
      GOTRUE_EXTERNAL_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_AZURE_SECRET: ${AZURE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_AZURE_URL: ${AZURE_URL:-https://login.microsoftonline.com/common}
      GOTRUE_EXTERNAL_AZURE_REDIRECT_URI: ${API_EXTERNAL_URL:-http://localhost:54321}/auth/v1/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # Supabase REST (PostgREST) — expone los esquemas de negocio
  # ------------------------------------------------------------------
  supabase-rest:
    image: postgrest/postgrest:v12.2.12
    profiles: [supabase-local]
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public,tfm
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # Supabase Realtime — notifica cambios de estado de documentos
  # El container_name es obligatorio: Realtime deduce el tenant
  # ("realtime-dev") del primer segmento del hostname.
  # ------------------------------------------------------------------
  supabase-realtime:
    image: supabase/realtime:v2.34.47
    profiles: [supabase-local]
    container_name: realtime-dev.supabase-realtime
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # Supabase Storage — almacenamiento de documentos fuente
  # ------------------------------------------------------------------
  supabase-storage:
    image: supabase/storage-api:v1.25.7
    profiles: [supabase-local]
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - supabase-storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # postgres-meta — API de metadatos que usa Studio
  # ------------------------------------------------------------------
  supabase-meta:
    image: supabase/postgres-meta:v0.91.0
    profiles: [supabase-local]
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-}
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # Kong — API gateway de Supabase (auth, rest, realtime, storage)
  # ------------------------------------------------------------------
  supabase-kong:
    image: kong:2.8.1
    profiles: [supabase-local]
    restart: unless-stopped
    depends_on:
      supabase-auth:
        condition: service_healthy
      supabase-rest:
        condition: service_started
      supabase-storage:
        condition: service_healthy
      supabase-realtime:
        condition: service_started
      supabase-meta:
        condition: service_started
    ports:
      - "54321:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - ./supabase/docker/kong.yml:/home/kong/temp.yml:ro
    # Sustituye las variables $SUPABASE_* dentro de kong.yml antes de arrancar
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # Supabase Studio — consola de administración de la BD
  # ------------------------------------------------------------------
  supabase-studio:
    image: supabase/studio:2025.06.30-sha-6f5982d
    profiles: [supabase-local]
    restart: unless-stopped
    depends_on:
      supabase-meta:
        condition: service_started
    ports:
      - "54323:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-Produbanco}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-Soporte TI}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL:-http://localhost:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # Redis 7 — cache de embeddings/resultados + Redis Streams (ingesta)
  # noeviction: los streams nunca deben ser desalojados; las claves de
  # cache se crean siempre con TTL (REDIS_CACHE_TTL).
  # ------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # Ollama — LLM local (Qwen3 4B Instruct)
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama-local]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # rag-service — orquestación RAG (interno: solo lo llama el api-gateway)
  # Por defecto usa el Ollama nativo del host; con --profile ollama-local: OLLAMA_HOST_DOCKER=http://ollama:11434
  # ------------------------------------------------------------------
  rag-service:
    build:
      context: ./services
      dockerfile: rag-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST_DOCKER:-http://host.docker.internal:11434}
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
    depends_on:
      redis:
        condition: service_healthy
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # ingest-service — API de ingesta + worker de Redis Streams (interno)
  # Para escalar workers: añadir réplicas con
  #   command: ["python", "-m", "app.workers.stream_consumer"]
  # ------------------------------------------------------------------
  ingest-service:
    build:
      context: ./services
      dockerfile: ingest-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_ENABLED: "true"
      LOG_FORMAT: json
    depends_on:
      redis:
        condition: service_healthy
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # analytics-service — métricas y reportes (interno)
  # ------------------------------------------------------------------
  analytics-service:
    build:
      context: ./services
      dockerfile: analytics-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
    depends_on:
      redis:
        condition: service_healthy
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # api-gateway — ÚNICO punto de entrada público (auth, roles, rate limit, trazas)
  # ------------------------------------------------------------------
  api-gateway:
    build:
      context: ./services
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RAG_SERVICE_URL: http://rag-service:8001
      INGEST_SERVICE_URL: http://ingest-service:8002
      ANALYTICS_SERVICE_URL: http://analytics-service:8003
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      rag-service:
        condition: service_started
      ingest-service:
        condition: service_started
      analytics-service:
        condition: service_started
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # frontend — Admin Portal React servido por nginx (http://localhost:3000)
  # Las variables VITE_* son públicas y se fijan al construir la imagen.
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8000}
        VITE_APP_NAME: ${VITE_APP_NAME:-Soporte TI Producción}
        VITE_AZURE_ENABLED: ${AZURE_ENABLED:-false}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # teams-bot — Bot de Microsoft Teams (Microsoft 365 Agents SDK), :3978
  # Teams llega a /api/messages a través de un túnel (ngrok) o un dominio público.
  # ------------------------------------------------------------------
  teams-bot:
    build:
      context: ./teams-bot
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_URL: http://api-gateway:8000
    ports:
      - "3978:3978"
    depends_on:
      api-gateway:
        condition: service_started
    networks: [soporte-net]

  # ------------------------------------------------------------------
  # Jaeger (opcional) — trazas OpenTelemetry
  #   docker compose --profile observability up -d jaeger
  # ------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [soporte-net]
