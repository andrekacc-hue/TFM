[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway"
version = "0.4.0"
description = "Punto único de entrada: autenticación, autorización por rol, rate limiting, trazas y enrutamiento."
requires-python = ">=3.11"
dependencies = [
  "soporte-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "limits>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "respx>=0.21", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
