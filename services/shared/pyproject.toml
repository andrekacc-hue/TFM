[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soporte-shared"
version = "0.2.0"
description = "Librería compartida de los microservicios: configuración, logging, clientes Supabase/Redis, auth y esquemas."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "redis>=5.0",
]

[project.optional-dependencies]
# Embeddings locales (sentence-transformers arrastra PyTorch)
ml = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["shared"]
omit = ["shared/embeddings.py"]
